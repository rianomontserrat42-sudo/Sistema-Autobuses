<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autobus - {% block titulo %}{% endblock %}</title>
<style>
  body { font-family: "Segoe UI", sans-serif; background:#f3f4fa; margin:0; color:#2d3550; }
  nav { background:#fff; padding:12px 24px; display:flex; gap:8px; box-shadow:0 1px 4px #0001; }
  nav a { padding:8px 18px; border-radius:20px; text-decoration:none; color:#4b5675; font-weight:600; }
  nav a.activo { background:#2f63c7; color:#fff; }
  main { max-width:900px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border-radius:18px; padding:24px; margin-bottom:20px; box-shadow:0 1px 4px #0001; }
  .btn { display:inline-block; background:#2f63c7; color:#fff; border:0; padding:12px 22px; border-radius:10px; font-size:1rem; text-decoration:none; cursor:pointer; }
  .msg { padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  .msg.ok { background:#d9f7e3; } .msg.error { background:#fde0e0; }
  table { width:100%; border-collapse:separate; border-spacing:0; border:2px solid #2f63c7; border-radius:14px; overflow:hidden; }
  thead th { background:linear-gradient(#3a72d8,#2557b8); color:#fff; padding:14px; text-align:left; }
  td { padding:12px 14px; border-bottom:1px solid #d6def3; }
  tbody tr:nth-child(even) td { background:#eef3fd; }
  tbody tr:nth-child(odd) td { background:#fff; }
  tbody tr:hover td { background:#dce8fb; }
  tbody tr:last-child td { border-bottom:0; }
  .acc { display:inline-block; border:0; border-radius:8px; padding:6px 14px; font-size:.9rem; font-weight:600; color:#fff; cursor:pointer; text-decoration:none; font-family:inherit; }
  .acc.editar { background:#2f63c7; } .acc.borrar { background:#d64545; }
  .asiento-tag { display:inline-block; background:#2f63c7; color:#fff; border-radius:8px; padding:2px 12px; font-weight:700; }
  .pie { text-align:center; padding:18px 16px 28px; color:#6b7490; font-size:1.05rem; }
  .pie strong { color:#2f63c7; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}" class="{{ 'activo' if request.endpoint=='index' }}">Inicio</a>
  <a href="{{ url_for('vender') }}" class="{{ 'activo' if request.endpoint=='vender' }}">Vender boletos</a>
  <a href="{{ url_for('boletos') }}" class="{{ 'activo' if request.endpoint=='boletos' }}">Boletos vendidos</a>
</nav>
<main>
  {% for cat, m in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
  {% block contenido %}{% endblock %}
</main>
<footer class="pie">Sistema Autobus · <strong>𝔪𝔬𝔫𝔰𝔢𝔯𝔯𝔞𝔱 ℜ𝔦𝔞ñ𝔬 𝔊𝔞𝔯𝔠𝔦𝔞</strong></footer>
</body>
</html>
